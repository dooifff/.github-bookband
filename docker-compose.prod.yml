version: '3.8'

services:
  # ============================================
  # Nginx - Reverse Proxy
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: studiobook-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend/docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf
      - ./backend/docker/nginx/ssl:/etc/nginx/ssl
      - ./backend/public:/var/www/public
      - storage-uploads:/var/www/storage/app/public
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - studiobook-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # API - Laravel Backend
  # ============================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: studiobook-api
    restart: unless-stopped
    volumes:
      - storage-app:/var/www/storage/app
      - storage-logs:/var/www/storage/logs
      - storage-framework:/var/www/storage/framework
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-studiobook}
      - DB_USERNAME=${DB_USERNAME:-studiobook}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - studiobook-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # ============================================
  # Web - React Frontend
  # ============================================
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: studiobook-web
    restart: unless-stopped
    networks:
      - studiobook-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # MySQL Database
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: studiobook-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-studiobook}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME:-studiobook}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./backend/docker/mysql/backup:/var/lib/mysql/backup
    networks:
      - studiobook-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
      --max-connections=200
      --slow-query-log=1
      --long-query-time=2
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ============================================
  # Redis Cache
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: studiobook-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - studiobook-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ============================================
  # Queue Worker
  # ============================================
  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: studiobook-queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - storage-app:/var/www/storage/app
      - storage-logs:/var/www/storage/logs
      - storage-framework:/var/www/storage/framework
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-studiobook}
      - DB_USERNAME=${DB_USERNAME:-studiobook}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
    depends_on:
      - api
      - mysql
      - redis
    networks:
      - studiobook-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # ============================================
  # Scheduler
  # ============================================
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: studiobook-scheduler
    restart: unless-stopped
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction &\;
        sleep 60;\n      done"
    volumes:
      - storage-app:/var/www/storage/app
      - storage-logs:/var/www/storage/logs
      - storage-framework:/var/www/storage/framework
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-studiobook}
      - DB_USERNAME=${DB_USERNAME:-studiobook}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
    depends_on:
      - api
      - mysql
      - redis
    networks:
      - studiobook-network

  # ============================================
  # Horizon (Queue Dashboard)
  # ============================================
  horizon:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: studiobook-horizon
    restart: unless-stopped
    command: php artisan horizon
    volumes:
      - storage-app:/var/www/storage/app
      - storage-logs:/var/www/storage/logs
      - storage-framework:/var/www/storage/framework
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-studiobook}
      - DB_USERNAME=${DB_USERNAME:-studiobook}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
    depends_on:
      - api
      - mysql
      - redis
    networks:
      - studiobook-network

networks:
  studiobook-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  storage-app:
  storage-logs:
  storage-framework:
  storage-uploads:

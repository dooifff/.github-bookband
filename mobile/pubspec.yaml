name: studiobook
description: StudioBook - Music Studio Booking Platform Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # HTTP Client
  dio: ^5.4.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Navigation
  go_router: ^13.0.0
  
  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_screenutil: ^5.9.0
  
  # Image
  cached_network_image: ^3.3.0
  image_picker: ^1.0.7
  
  # Location
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  
  # Firebase
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^17.0.0
  
  # Utils
  intl: ^0.19.0
  url_launcher: ^6.2.3
  equatable: ^2.0.5
  share_plus: ^7.2.1
  
  # Loading & Feedback
  flutter_spinkit: ^5.2.1
  shimmer: ^3.0.0
  http: ^1.2.0
  
  # Performance Monitoring
  system_info: ^1.0.1
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  
flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/

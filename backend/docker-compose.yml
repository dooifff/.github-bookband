version: '3.8'

services:
  # Nginx Service
  nginx:
    image: nginx:alpine
    container_name: studiobook-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
      - mysql
    networks:
      - studiobook-network

  # PHP Service
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studiobook-php
    restart: unless-stopped
    volumes:
      - .:/var/www
    depends_on:
      - mysql
      - redis
    networks:
      - studiobook-network

  # MySQL Service
  mysql:
    image: mysql:8.0
    container_name: studiobook-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: studiobook
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: studiobook
      MYSQL_PASSWORD: secret
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - studiobook-network

  # Redis Service
  redis:
    image: redis:alpine
    container_name: studiobook-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - studiobook-network

  # Queue Worker
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studiobook-queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www
    depends_on:
      - php
      - mysql
      - redis
    networks:
      - studiobook-network

  # Scheduler
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studiobook-scheduler
    restart: unless-stopped
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction &
        sleep 60;
      done"
    volumes:
      - .:/var/www
    depends_on:
      - php
      - mysql
      - redis
    networks:
      - studiobook-network

  # phpMyAdmin (optional, for development)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: studiobook-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: secret
    depends_on:
      - mysql
    networks:
      - studiobook-network

networks:
  studiobook-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
